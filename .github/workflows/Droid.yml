name: Droid Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;21.4.7075529"

      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

      - name: Setup Haxelib
        shell: bash
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install Haxe libraries
        shell: bash
        run: |
          set -e

          echo "Installing core libraries..."

          haxelib install lime 8.0.1 --always
          haxelib set lime 8.0.1

          haxelib install openfl 9.3.2 --always
          haxelib set openfl 9.3.2

          haxelib install flixel 5.5.0 --always
          haxelib set flixel 5.5.0

          haxelib install flixel-addons 3.2.1 --always
          haxelib set flixel-addons 3.2.1

          haxelib install flixel-ui 2.5.0 --always
          haxelib set flixel-ui 2.5.0

          haxelib install tjson 1.4.0 --always
          haxelib set tjson 1.4.0

          haxelib install SScript 7.7.0 --always
          haxelib set SScript 7.7.0

          echo "Installing flxanimate..."

          haxelib remove flxanimate || true
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev

          echo "Installing linc_luajit..."

          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git

          echo "Installing hxCodec..."

          haxelib remove hxCodec || true
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec.git

          echo "Installing extension-androidtools..."

          haxelib remove extension-androidtools || true
          haxelib git extension-androidtools https://github.com/jigsaw-4277821/extension-androidtools.git

          echo ""
          echo "Installed libraries:"
          haxelib list

      - name: Configure SScript
        shell: bash
        run: |
          printf '%s' 'oy9:showMacroty8:loopCosti25y10:includeAllfg' > "$HOME/settings.cocoa"

          echo "SScript settings configured:"
          cat "$HOME/settings.cocoa"

      - name: Setup Lime Android
        shell: bash
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          haxelib run lime setup android

      - name: Fix Project.xml FPS
        shell: bash
        run: |
          if grep -q '<app' Project.xml; then
            sed -i 's/fps=""/fps="60"/g' Project.xml
          fi

          echo "Project.xml FPS:"
          grep -n 'fps=' Project.xml || true

      - name: Verify source files
        shell: bash
        run: |
          echo "Checking SUtil.hx..."

          grep -n "AndroidContext\|AndroidEnvironment\|AndroidPermissions\|AndroidSettings" \
            source/mobile/backend/SUtil.hx || true

          echo ""
          echo "Checking import.hx..."

          grep -n "import android\." source/import.hx || true

      - name: Clean previous build
        shell: bash
        run: |
          rm -rf export
          rm -rf .haxelib
          rm -rf apk

      - name: Build Android Release
        shell: bash
        run: |
          set -e

          export JAVA_HOME="$JAVA_HOME"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          mkdir -p apk

          printf '%s' 'oy9:showMacroty8:loopCosti25y10:includeAllfg' > "$HOME/settings.cocoa"

          echo "Java:"
          java -version

          echo ""
          echo "Building Android Release..."

          haxelib run lime build android -release

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find export -type f -name "*.apk" -print || true

          APK=$(find export -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Files inside export:"
            find export -type f 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          cp "$APK" apk/Droid-Engine.apk

          echo ""
          echo "Final APK:"
          ls -lh apk/Droid-Engine.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Droid-Engine.apk
          path: apk/Droid-Engine.apk
          if-no-files-found: error
