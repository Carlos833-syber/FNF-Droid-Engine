name: Droid Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.4'

      - name: Setup Haxelib
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install Haxelib dependencies
        run: |
          haxelib install lime --always
          haxelib install openfl --always
          haxelib install flixel --always
          haxelib install flixel-addons --always
          haxelib install flixel-ui --always
          haxelib install tjson --always
          haxelib install flxanimate --always
          haxelib install linc_luajit --always
          haxelib install SScript --always
          haxelib install hxCodec --always
          haxelib install extension-androidtools --always

      - name: Setup Lime
        run: |
          haxelib run lime setup
          haxelib run lime setup android
          haxelib run openfl setup

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;21.4.7075529"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Build Lime Android project
        run: |
          haxelib run lime build android -release

      - name: Find Gradle project
        id: gradle
        run: |
          GRADLE_DIR=$(find . -type f -name gradlew -print -quit | xargs -r dirname)

          if [ -z "$GRADLE_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          echo "Gradle project: $GRADLE_DIR"
          echo "dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Fix AndroidManifest
        run: |
          GRADLE_DIR="${{ steps.gradle.outputs.dir }}"

          find "$GRADLE_DIR" -type f -name "AndroidManifest.xml" -exec \
            sed -i 's/if="lime &ge; 8.2.0"//g' {} \;

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Build APK with Gradle
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: |
          chmod +x gradlew

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Find APK
        run: |
          mkdir -p apk

          APK=$(find "${{ steps.gradle.outputs.dir }}" -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK não encontrado!"
            exit 1
          fi

          echo "APK encontrado: $APK"

          cp "$APK" apk/Droid-Engine.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Droid-Engine.apk
          path: apk/Droid-Engine.apk
          if-no-files-found: error
