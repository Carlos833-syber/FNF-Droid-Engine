name: Droid Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # HAXE
      # ============================================================

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;21.4.7075529"


      # ============================================================
      # ANDROID ENVIRONMENT
      # ============================================================

      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529"


      # ============================================================
      # HAXELIB
      # ============================================================

      - name: Setup Haxelib
        shell: bash
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"


      # ============================================================
      # HAXELIB DEPENDENCIES
      # ============================================================

      - name: Install Haxe libraries
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Installing Haxe libraries"
          echo "========================================"

          haxelib install lime 8.0.1 --always

          haxelib install openfl 9.3.2 --always

          haxelib install flixel 5.5.0 --always

          haxelib install flixel-addons 3.2.1 --always

          haxelib install flixel-ui 2.5.0 --always

          haxelib install tjson 1.4.0 --always

          haxelib install SScript 7.7.0 --always


          echo ""
          echo "Installing flxanimate..."

          haxelib remove flxanimate || true

          haxelib git flxanimate \
            https://github.com/ShadowMario/flxanimate \
            dev


          echo ""
          echo "Installing linc_luajit..."

          haxelib remove linc_luajit || true

          haxelib git linc_luajit \
            https://github.com/superpowers04/linc_luajit.git


          echo ""
          echo "Installing hxCodec..."

          haxelib remove hxCodec || true

          haxelib git hxCodec \
            https://github.com/polybiusproxy/hxCodec.git


          echo ""
          echo "Installing extension-androidtools..."

          haxelib remove extension-androidtools || true

          haxelib git extension-androidtools \
            https://github.com/jigsaw-4277821/extension-androidtools.git


          echo ""
          echo "========================================"
          echo "Installed Haxelibs"
          echo "========================================"

          haxelib list


      # ============================================================
      # PROJECT.XML
      # ============================================================

      - name: Fix Project.xml
        shell: bash
        run: |

          if grep -q 'fps=""' Project.xml; then
            sed -i 's/fps=""/fps="60"/g' Project.xml
          fi

          echo "Project.xml FPS configuration:"

          grep -n "fps=" Project.xml || true


      # ============================================================
      # VERIFY SUTIL
      # ============================================================

      - name: Verify SUtil
        shell: bash
        run: |

          echo "========================================"
          echo "Checking SUtil.hx"
          echo "========================================"

          if grep -n \
            "AndroidContext\|AndroidEnvironment\|AndroidPermissions\|AndroidSettings" \
            source/mobile/backend/SUtil.hx; then

            echo ""
            echo "ERROR:"
            echo "Old Android APIs are still present in SUtil.hx."

            exit 1

          else

            echo "SUtil.hx OK."

          fi


      # ============================================================
      # VERIFY IMPORT.HX
      # ============================================================

      - name: Verify import.hx
        shell: bash
        run: |

          echo "========================================"
          echo "Checking import.hx"
          echo "========================================"

          if grep -n "import android\." source/import.hx; then

            echo ""
            echo "ERROR:"
            echo "Old Android imports are still present."

            exit 1

          else

            echo "import.hx OK."

          fi


      # ============================================================
      # SETUP LIME ANDROID
      # ============================================================

      - name: Setup Lime Android
        shell: bash
        run: |

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          echo "========================================"
          echo "LIME ANDROID SETUP"
          echo "========================================"

          haxelib run lime setup android


      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Clean build
        shell: bash
        run: |

          rm -rf export
          rm -rf apk

          mkdir -p apk

          echo "Build directories cleaned."


      # ============================================================
      # BUILD ANDROID RELEASE
      # ============================================================

      - name: Build Android Release
        shell: bash
        run: |

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          echo "========================================"
          echo "ANDROID CONFIGURATION"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          echo ""
          echo "========================================"
          echo "HAXE VERSION"
          echo "========================================"

          haxe --version

          echo ""
          echo "========================================"
          echo "LIME VERSION"
          echo "========================================"

          haxelib run lime --version || true

          echo ""
          echo "========================================"
          echo "BUILDING ANDROID RELEASE"
          echo "========================================"

          printf 'N\n' | haxelib run lime build android -release


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find export \
            -type f \
            -name "*.apk" \
            -print || true

          APK=$(find export -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK was not generated."

            echo ""
            echo "Files inside export:"

            find export \
              -maxdepth 6 \
              -type f \
              -print 2>/dev/null || true

            exit 1

          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"


          cp "$APK" apk/Droid-Engine.apk


          echo ""
          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          ls -lh apk/Droid-Engine.apk


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Droid-Engine.apk
          path: apk/Droid-Engine.apk
          if-no-files-found: error
