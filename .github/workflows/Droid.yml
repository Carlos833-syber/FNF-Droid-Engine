name: Droid Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # HAXE
      # ============================================================

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # ANDROID
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;21.4.7075529"


      # ============================================================
      # ANDROID VARIABLES
      # ============================================================

      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"


      # ============================================================
      # HAXELIB
      # ============================================================

      - name: Setup Haxelib
        shell: bash
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"


      # ============================================================
      # INSTALL LIBRARIES
      # ============================================================

      - name: Install Haxe libraries
        shell: bash
        run: |
          set -e

          haxelib install lime 8.0.1 --always
          haxelib install openfl 9.3.2 --always
          haxelib install flixel 5.5.0 --always
          haxelib install flixel-addons 3.2.1 --always
          haxelib install flixel-ui 2.5.0 --always
          haxelib install tjson 1.4.0 --always
          haxelib install SScript 7.7.0 --always

          haxelib remove flxanimate || true
          haxelib git flxanimate https://github.com/ShadowMario/flxanimate dev

          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git

          haxelib remove hxCodec || true
          haxelib git hxCodec https://github.com/polybiusproxy/hxCodec.git

          haxelib remove extension-androidtools || true
          haxelib git extension-androidtools https://github.com/jigsaw-4277821/extension-androidtools.git

          echo ""
          echo "========== HAXELIBS =========="
          haxelib list


      # ============================================================
      # SETUP LIME
      # ============================================================

      - name: Setup Lime Android
        shell: bash
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          haxelib run lime setup android


      # ============================================================
      # INITIALIZE SSCRIPT
      # ============================================================

      - name: Initialize SScript
        shell: bash
        run: |

          echo "========================================"
          echo "INITIALIZING SSCRIPT"
          echo "========================================"

          SETTINGS="$HOME/settings.cocoa"

          rm -f "$SETTINGS"

          echo "Running SScript setup..."

          set +e

          timeout 20s bash -c '
            printf "N\n" |
            haxelib run lime test neko
          '

          RESULT=$?

          set -e

          echo "SScript initialization returned: $RESULT"

          if [ -f "$SETTINGS" ]; then
            echo "SScript settings file created:"
            ls -lh "$SETTINGS"
          else
            echo "WARNING: settings.cocoa was not created."
          fi


      # ============================================================
      # CHECK SSCRIPT SETTINGS
      # ============================================================

      - name: Check SScript
        shell: bash
        run: |

          echo "========================================"
          echo "SSCRIPT CHECK"
          echo "========================================"

          if [ -f "$HOME/settings.cocoa" ]; then
            echo "SScript has been initialized."
          else
            echo "SScript has no settings file."
          fi


      # ============================================================
      # PROJECT.XML
      # ============================================================

      - name: Fix Project.xml
        shell: bash
        run: |

          if grep -q 'fps=""' Project.xml; then
            sed -i 's/fps=""/fps="60"/g' Project.xml
          fi

          grep -n "fps=" Project.xml || true


      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify source
        shell: bash
        run: |

          echo "Checking SUtil.hx..."

          if grep -n \
            "AndroidContext\|AndroidEnvironment\|AndroidPermissions\|AndroidSettings" \
            source/mobile/backend/SUtil.hx; then

            echo "ERROR: Old Android API found in SUtil.hx."
            exit 1

          fi

          echo "SUtil.hx OK."

          echo ""
          echo "Checking import.hx..."

          if grep -n "import android\." source/import.hx; then

            echo "ERROR: Old Android imports found in import.hx."
            exit 1

          fi

          echo "import.hx OK."


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean build
        shell: bash
        run: |

          rm -rf export
          rm -rf apk

          mkdir -p apk


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Android Release
        shell: bash
        run: |

          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529"

          echo "========================================"
          echo "ANDROID"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          echo ""
          echo "========================================"
          echo "HAXE"
          echo "========================================"

          haxe --version

          echo ""
          echo "========================================"
          echo "LIME"
          echo "========================================"

          haxelib run lime --version

          echo ""
          echo "========================================"
          echo "BUILD"
          echo "========================================"

          haxelib run lime build android -release


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |

          echo "========================================"
          echo "SEARCHING APK"
          echo "========================================"

          find export \
            -type f \
            -name "*.apk" \
            -print || true

          APK=$(find export -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" apk/Droid-Engine.apk

          echo ""
          echo "FINAL APK:"
          ls -lh apk/Droid-Engine.apk


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Droid-Engine.apk
          path: apk/Droid-Engine.apk
          if-no-files-found: error
