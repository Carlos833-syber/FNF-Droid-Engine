name: Droid Engine
'on': [push, workflow_dispatch]

jobs: {build: {runs-on: ubuntu-22.04, steps: [
{name: 'Checkout', uses: 'actions/checkout@v4'},

{name: 'Java 17', uses: 'actions/setup-java@v4', with: {distribution: 'temurin', 'java-version': '17'}},

{name: 'Android SDK', uses: 'android-actions/setup-android@v3'},

{name: 'Instalar SDK e NDK', run: 'sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;21.4.7075529"'},

{name: 'Haxe 4.3.4', uses: 'krdlab/setup-haxe@v1', with: {haxe-version: '4.3.4'}},

{name: 'Instalar dependências', run: 'haxelib setup /home/runner/haxelib && haxelib install lime && haxelib install openfl && haxelib install flixel && haxelib install flixel-addons && haxelib install flixel-ui && haxelib install tjson && haxelib install hxCodec && haxelib install flxanimate && haxelib install SScript && haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git'},

{name: 'Configurar SScript', run: 'printf ''oy9:showMacroty8:loopCosti25y10:includeAllfg'' > "$HOME/settings.cocoa"'},

{name: 'Configurar Lime Android', run: 'ANDROID_HOME="$ANDROID_SDK_ROOT" ANDROID_SDK="$ANDROID_SDK_ROOT" ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529" haxelib run lime setup android'},

{name: 'Remover extension-androidtools', run: 'sed -i ''/extension-androidtools/d'' Project.xml || true'},

{name: 'Java 11 para Gradle', uses: 'actions/setup-java@v4', with: {distribution: 'temurin', 'java-version': '11'}},

{name: 'Compilar APK', run: 'ANDROID_HOME="$ANDROID_SDK_ROOT" ANDROID_SDK="$ANDROID_SDK_ROOT" ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/21.4.7075529" haxelib run lime build android -release'},

{name: 'Localizar APK', run: 'find export -type f -name "*.apk" -print'},

{name: 'Preparar APK', run: 'mkdir -p dist && APK=$(find export -type f -name "*.apk" | head -n 1) && if [ -z "$APK" ]; then echo "APK não encontrado"; exit 1; fi && cp "$APK" dist/FNF-Droid-Engine.apk'},

{name: 'Criar keystore', run: 'keytool -genkeypair -v -keystore "$HOME/fnf-release.keystore" -alias fnf -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=FNF Droid Engine, OU=Android, O=FNF, L=Brazil, ST=Alagoas, C=BR"'},

{name: 'Assinar APK', run: 'APK="dist/FNF-Droid-Engine.apk" && "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$HOME/fnf-release.keystore" --ks-pass pass:android --key-pass android "$APK" && "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"'},

{name: 'Upload APK', uses: 'actions/upload-artifact@v4', with: {name: 'FNF-Droid-Engine-APK', path: 'dist/FNF-Droid-Engine.apk', 'if-no-files-found': 'error'}}
]}}
