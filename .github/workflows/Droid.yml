name: Droid Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Droid Engine APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.4'

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install Haxe libraries
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install tjson
          haxelib install flxanimate
          haxelib install linc_luajit
          haxelib install SScript

      - name: Show installed libraries
        run: |
          haxelib list

      - name: Setup Lime and OpenFL
        run: |
          haxelib run lime setup
          haxelib run lime setup android
          haxelib run openfl setup

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;21.4.7075529"

      - name: Configure Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK "$ANDROID_SDK_ROOT/ndk/21.4.7075529"

      - name: Check Project.xml
        run: |
          if [ ! -f Project.xml ]; then
            echo "ERRO: Project.xml não encontrado."
            exit 1
          fi

          echo "Project.xml encontrado."

      - name: Build Android with Lime
        run: |
          haxelib run lime build android -release

      - name: Show generated Android project
        run: |
          find . -maxdepth 10 -type f \( \
            -name "gradlew" \
            -o -name "build.gradle" \
            -o -name "AndroidManifest.xml" \
            \) -print

      - name: Find Android Project
        id: android_project
        run: |
          GRADLE=$(find . -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLE" ]; then
            echo "ERRO: Gradle wrapper não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE")

          echo "Projeto Android:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Fix AndroidManifest
        run: |
          MANIFEST=$(find . -type f -name "AndroidManifest.xml" | head -n 1)

          if [ -n "$MANIFEST" ]; then
            echo "Manifest encontrado: $MANIFEST"

            sed -i 's/ if="lime &ge; 8.2.0"//g' "$MANIFEST"
            sed -i 's/if="lime &ge; 8.2.0"//g' "$MANIFEST"
          fi

      - name: Create Debug Keystore
        run: |
          mkdir -p "$HOME/.android"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Release APK
        run: |
          cd "${{ steps.android_project.outputs.project_dir }}"

          chmod +x gradlew

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=AndroidDebugKey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon

      - name: Find APK
        run: |
          echo "APKs encontrados:"
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p apk

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          cp "$APK" apk/Droid-Engine.apk

          echo "APK final:"
          ls -lh apk/Droid-Engine.apk

      - name: Upload Droid Engine APK
        uses: actions/upload-artifact@v4
        with:
          name: Droid-Engine.apk
          path: apk/Droid-Engine.apk
          if-no-files-found: error
